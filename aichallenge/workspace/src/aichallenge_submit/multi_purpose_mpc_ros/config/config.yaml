common:
  save_config: false

sim_logger:
  animation_enabled: false

map:
  # path from pkg share dir
  yaml_path: "env/final_ver3/occupancy_grid_map.yaml"

waypoints:
  # path from pkg share dir
  # csv_path: "maps/occupancy_grid_map_waypoints.csv"
  csv_path: ""

obstacles:
  # path from pkg share dir
  csv_path: "" # If empty, the obstacles information will be subscribed from the topic
  # csv_path: "maps/occupancy_grid_map_obstacles.csv"
  radius: 1.25

reference_path:
  update_by_topic: false # When true, 'circle' must be false
  # path from pkg share dir
  # csv_path: ""
  csv_path: "env/final_ver3/traj_mincurv_optimized.csv"
  resolution: 0.4
  smoothing_distance: 3
  max_width: 3.0
  circular: true

  # Override path bounds (width bounds relative to center line)
  override_path_bounds: true
  min_bound: -1.5 # [m] Left bound
  max_bound: 1.5  # [m] Right bound
  use_path_constraints_topic: false
  use_border_cells_topic: false

bicycle_model:
  length: 1.087
  width: 1.0

mpc:
  N: 20
  # Q: [e_y, e_psi, t]
  # R: [v, delta]
  # QN: [e_y, e_psi, t]
  R: [0.1, 1200.0]  # Smooth steering effort with OSQP native rate limit
  a_min: -1.6 # m/s^2
  a_max: 2.5 # m/s^2 (competitive acceleration matching top team performance)
  delta_max_deg: 32.0 # degrees
  steer_rate_max: 2.5 # rad/s (OSQP native smooth steer-rate limit eliminating phase-lag self-excitation)
  control_rate: 40.0 # Hz
  steering_tire_angle_gain_var: 1.0   # 1:1 exact steering gain
  # accel_low_pass_gain: 0.1
  # steer_low_pass_gain: 0.3
  accel_low_pass_gain: 1.0
  steer_low_pass_gain: 0.60 # Smooth output filtering eliminating straight-line micro oscillations
  wp_id_offset: 1            # 80-100ms lookahead offset compensating system latency
  use_max_kappa_pred: false
  delay_compensation_sec: 0.10             # [s] 100ms steering latency compensation for early turn-in
  enable_dynamic_delay_compensation: false # Disabled to eliminate discrete offset jump oscillation post-curve

  ## --- 高速最適安定周回 (OSQPソルバ完全実現可能性・衝突ゼロ) --- ##
  v_max: 45.0
  ay_max: 9.5 # Physical lateral acceleration limit (9.5 m/s^2) for stable cornering
  Q: [300.0, 600.0, 100.0] # Harmonious tracking with low heading oscillation
  QN: [300.0, 600.0, 100.0]

  ## -------- 低速 -------------- ##
  ## Lap1: 86s

  # v_max: 15.0
  # ay_max: 5.5
  # Q: [5000000.0, 100000000.0, 2000000.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  # QN: [1000000.0, 1000.0, 10000.0]

v2x_obstacle_avoidance:
  vehicle_radius: 1.0          # [m] 通常走行時の障害物半径
  v_max_safety: 30.0           # [m/s]
  position_jump_threshold: 5.0 # [m]

  # --- 近接速度制限 (Layer 1) ---
  follow_distance_start: 15.0  # [m] FOLLOWING モード開始距離
  follow_distance_brake: 5.0   # [m] EMERGENCY_BRAKE モード開始距離

  # --- 最低安全速度・TTC (Layer 1 & 2) ---
  v_min_safe: 8.0              # [km/h] 最低安全速度
  ttc_threshold: 1.5           # [s] 衝突予測時間がこれ以下で緊急ブレーキ
  forward_cos_threshold: 0.65  # 前方判定の cos 閾値
  startup_suppress_sec: 3.0    # [s] 走行開始後この時間は V2X 制御を無効化 (3秒に短縮し即時有効化)

  # --- 追い越し (Layer 3) ---
  overtake_patience: 3.0       # [s] FOLLOWING 継続後、追い越しモードに移行するまでの時間
  overtake_gap_min: 10.0       # [m] 追い越し判断の最大距離
  overtake_clearance: 8.0      # [m] 追い越し完了と判断する前方距離
  vehicle_radius_overtake: 0.65 # [m] 追い越し中の障害物半径（0.65mに調整し横抜け時の角すれ違い安全性を確保）
  overtake_speed_diff_threshold: 3.0 # [m/s] (約10.8km/h) 自車・前車の速度差がこれ以上でダイレクト OVERTAKING 遷移
  cross_velocity_threshold: 2.5 # [m/s] (約9.0km/h) 前車がこれ以上の横方向速度で自車前方を横切っている場合はダイレクト OVERTAKING をブロック
  wp_lookahead_max: 45         # [WP] 同一コース沿道判定の最大先読みウェイポイント数（18m先まで拡大しスタック車を早期検出）
  wp_dist_max: 2.5             # [m] 他車座標から最寄ウェイポイントまでの最大離れ距離（コース外・壁裏を除外）

stuck_recovery:
  enable_stuck_recovery: true
  stuck_velocity_threshold: 0.25   # [m/s] 完全静止レベル判定閾値
  stuck_time_threshold: 1.0        # [s] スタック判定時間
  reverse_speed: -2.5              # [m/s] バック時の目標速度 (約 -9.0 km/h)
  reverse_duration: 2.2            # [s] バック継続時間
  stop_duration: 0.4               # [s] ギアシフト・確認停止時間
  reverse_steer_angle: 0.40        # [rad] (約23度) バック時回避切返し操舵角
