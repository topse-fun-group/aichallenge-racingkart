common:
  save_config: false

sim_logger:
  animation_enabled: false

map:
  # path from pkg share dir
  yaml_path: "env/final_ver3/occupancy_grid_map.yaml"

waypoints:
  # path from pkg share dir
  # csv_path: "maps/occupancy_grid_map_waypoints.csv"
  csv_path: ""

obstacles:
  # path from pkg share dir
  csv_path: "" # If empty, the obstacles information will be subscribed from the topic
  # csv_path: "maps/occupancy_grid_map_obstacles.csv"
  radius: 1.25

reference_path:
  update_by_topic: false # When true, 'circle' must be false
  # path from pkg share dir
  # csv_path: ""
  csv_path: "env/final_ver3/traj_mincurv.csv"
  resolution: 0.6
  smoothing_distance: 2
  max_width: 6.0
  circular: true
  use_path_constraints_topic: false
  use_border_cells_topic: false
  # use_path_constraints_topic: true
  # use_border_cells_topic: true

bicycle_model:
  length: 1.087
  # width: 1.45   # real machine width
  width: 2.30   # +safety margin

mpc:
  N: 10
  # Q: [e_y, e_psi, t]
  # R: [v, delta]
  # QN: [e_y, e_psi, t]
  R: [100000.0, 1000.0]
  a_min: -3.5 # m/s^2 (ブレーキ強化で急カーブ対応)
  a_max: 3.0  # m/s^2 (加速力向上→30km/h超へ素早く到達)
  delta_max_deg: 32.0 # degrees
  # rad/s at the actuator. Was 0.35, which took 2.6 s to reach full lock and made the
  # rate limiter — not the QP — the binding constraint on steering. The tightest S-curve
  # on this track (wp~279, two opposite U-turns 4 m apart) needs ~0.83 rad/s at 28 km/h.
  # Raise in steps (1.2 -> 1.6 -> 2.0) and stop before oscillation appears.
  steer_rate_max: 1.2
  control_rate: 40.0 # Hz
  steering_tire_angle_gain_var: 1.639
  accel_low_pass_gain: 0.8
  steer_low_pass_gain: 0.4
  wp_id_offset: 3
  use_max_kappa_pred: true

  # Reference velocity profile (built once at startup from the raceline CSV's vx_mps column)
  v_ref_scale: 1.0      # global multiplier on the CSV design speed (lap-time tuning)
  v_ref_min_kmh: 31.0   # floor, so tight apexes are not crawled through default 30.0

  # Lower bound on the speed the spatial model is linearised about [m/s].
  # NOT a lower bound on the commanded speed. The model divides by this speed
  # (b_3 = -delta_s/v^2), so letting it follow v_ref down to 0 while following a slow
  # leader swings the B matrix by ~625x and then jumps discontinuously at exactly 0,
  # which corrupts the lateral solution.
  v_lin_min: 4.0 # default 3.0


  ## ---------- 究極 ------------- ##
  ## Lap1: 53s, Lap2: 47s

  # v_max: 30.0   # km/h
  # ay_max: 12.0  # m/s^2, maximum lateral acceleration in curves
  # Q: [600000.0, 100000000.0, 2000000.0]
  # QN: [1000000.0, 1000000.0, 10000.0]

  ## --- 高速 (gnss delay 0.3) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 高速 (gnss delay 0.4) --- ##
  ## Lap1: 55s, Lap2: 49s

  # v_max: 30.0
  # ay_max: 9.5
  # Q: [1000000.0, 100000000.0, 1850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --- 中高速 --- ##
  ## Lap1: 59s, Lap2: 54s
  # v_max: 25.0
  # ay_max: 7.0
  # Q: [1000000.0, 100000000.0, 850000.0]
  # QN: [1000000.0, 1000.0, 10000.0]

  ## --------- カスタム ------------ ##
  v_max: 55.0 # default 45.0
  ay_max: 9.5
  Q: [1000000.0, 100000000.0, 850000.0] # 中高速プリセット
  QN: [1000000.0, 1000.0, 10000.0]

  ## -------- 低速 -------------- ##
  ## Lap1: 86s

  # v_max: 15.0
  # ay_max: 5.5
  # Q: [5000000.0, 100000000.0, 200000.0] # 低速だとインを攻めがちなので、あえて外に膨らむパラメータ
  # QN: [1000000.0, 1000.0, 10000.0]

v2x_obstacle_avoidance:
  vehicle_radius: 0.5          # [m]
  v_max_safety: 30.0           # [m/s]
  position_jump_threshold: 5.0 # [m]

pure_pursuit:
  wheel_base: 1.087
  lookahead_gain: 0.3
  lookahead_min_distance: 3.5
  speed_proportional_gain: 80.0
  use_external_target_vel: false
  external_target_vel: 10.0
  steering_tire_angle_gain: 1.1  # lowered from 1.5: the curvature-adaptive lookahead below
                                 # shortens Ld in corners, which raises the geometric demand
  speed_scale_factor: 1.0        # was 1.2; v_ref is now the real design profile

  # Lookahead is computed from the measured speed, then shortened by the upcoming
  # curvature. On this track the S-curves are tight U-turns separated by only 4-10 m,
  # so a fixed 8 m lookahead spans the whole inflection and commands near-zero steering.
  lookahead_min_speed: 3.0                # [m/s] floor for the Ld speed term
  curvature_lookahead_shrink: 3.0         # Ld *= 1 - shrink * |kappa_ahead|
  curvature_lookahead_min_ratio: 0.45     # lower bound on that ratio
  lookahead_hard_min: 3.0                 # [m] absolute floor on Ld
